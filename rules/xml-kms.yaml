# their length kept; KMS and user URIs take the URI mappings of SIP and MIKEY; the times follow
# --time-shift. A KMS signature (ds:SignatureValue) follows the 003 rule of the ds namespace.
# The element inventory follows the schemas of §D.3.5 and §D.4.4.
# XML rule set (feature 003).
