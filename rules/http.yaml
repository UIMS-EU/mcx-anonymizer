# SPDX-License-Identifier: GPL-3.0-or-later
#
# HTTP rule set (feature 007): methods, header fields (in the header format of the SIP rule set,
# with the HTTP grammars), bodies by content type, path segments kept outside XCAP, and cookie
# attributes. Everything without a rule is removed. Sources: rules/SOURCES.md § HTTP rule set.
ruleset: mcxanon-http
version: 1.0.0
methods:
  - {name: GET, source: {spec: RFC 9110, version: "2022-06", clause: "9.3.1"}}
  - {name: HEAD, source: {spec: RFC 9110, version: "2022-06", clause: "9.3.2"}}
  - {name: POST, source: {spec: RFC 9110, version: "2022-06", clause: "9.3.3"}}
  - {name: PUT, source: {spec: RFC 9110, version: "2022-06", clause: "9.3.4"}}
  - {name: DELETE, source: {spec: RFC 9110, version: "2022-06", clause: "9.3.5"}}
  - {name: CONNECT, source: {spec: RFC 9110, version: "2022-06", clause: "9.3.6"}}
  - {name: OPTIONS, source: {spec: RFC 9110, version: "2022-06", clause: "9.3.7"}}
headers:
  - name: Host
    grammar: host
    components:
      host: {action: pseudonymise, category: host}
      port: {action: keep}
    source: {spec: RFC 9110, version: "2022-06", clause: "7.2"}
  - name: Content-Type
    grammar: media-type
    components:
      value: {action: keep}
    params:
      - {name: charset, action: keep, value: token, source: {spec: RFC 9110, version: "2022-06", clause: "8.3.2"}}
      - {name: boundary, action: pseudonymise, category: boundary, value: any, source: {spec: RFC 2046, version: "1996-11", clause: "5.1.1"}}
    source: {spec: RFC 9110, version: "2022-06", clause: "8.3"}
  - name: Content-Length
    grammar: number
    action: keep
    source: {spec: RFC 9110, version: "2022-06", clause: "8.6"}
  - name: Transfer-Encoding
    grammar: token-list
    multi: true
    action: keep
    values: [chunked]
    source: {spec: RFC 9112, version: "2022-06", clause: "6.1"}
  - name: Content-Encoding
    grammar: token-list
    multi: true
    action: keep
    values: [identity, gzip, deflate, compress]
    source: {spec: RFC 9110, version: "2022-06", clause: "8.4.1"}
  - name: Connection
    grammar: token-list
    multi: true
    action: keep
    values: [close, upgrade, te]
    source: {spec: RFC 9110, version: "2022-06", clause: "7.6.1"}
  - name: Upgrade
    grammar: token-list
    multi: true
    action: keep
    values: [h2c, websocket]
    source: {spec: RFC 9110, version: "2022-06", clause: "7.8"}
    note: "h2c: RFC 9113 §3.1 (deprecated upgrade token); websocket: RFC 6455 §4.1"
  - name: Accept
    grammar: media-type
    multi: true
    components:
      value: {action: keep}
    params:
      - {name: q, action: keep, value: token, source: {spec: RFC 9110, version: "2022-06", clause: "12.4.2"}}
    source: {spec: RFC 9110, version: "2022-06", clause: "12.5.1"}
  - name: Accept-Encoding
    grammar: token-list
    multi: true
    action: keep
    values: [identity, gzip, deflate, compress, "*"]
    params:
      - {name: q, action: keep, value: token, source: {spec: RFC 9110, version: "2022-06", clause: "12.4.2"}}
    source: {spec: RFC 9110, version: "2022-06", clause: "12.5.3"}
  - name: Cache-Control
    grammar: directives
    multi: true
    action: keep
    values: [max-age, max-stale, min-fresh, no-cache, no-store, no-transform, only-if-cached, must-revalidate, must-understand, private, proxy-revalidate, public, s-maxage]
    source: {spec: RFC 9111, version: "2022-06", clause: "5.2"}
  - name: Pragma
    grammar: directives
    multi: true
    action: keep
    values: [no-cache]
    source: {spec: RFC 9111, version: "2022-06", clause: "5.4"}
  - name: Expires
    grammar: date
    action: keep
    source: {spec: RFC 9111, version: "2022-06", clause: "5.3"}
  - name: Age
    grammar: number
    action: keep
    source: {spec: RFC 9111, version: "2022-06", clause: "5.1"}
  - name: Date
    grammar: date
    action: keep
    source: {spec: RFC 9110, version: "2022-06", clause: "6.6.1"}
  - name: Last-Modified
    grammar: date
    action: keep
    source: {spec: RFC 9110, version: "2022-06", clause: "8.8.2"}
  - name: If-Modified-Since
    grammar: date
    action: keep
    source: {spec: RFC 9110, version: "2022-06", clause: "13.1.3"}
  - name: If-Unmodified-Since
    grammar: date
    action: keep
    source: {spec: RFC 9110, version: "2022-06", clause: "13.1.4"}
  - name: ETag
    grammar: etag-list
    components:
      value: {action: pseudonymise, category: entity-tag}
    source: {spec: RFC 9110, version: "2022-06", clause: "8.8.3"}
  - name: If-Match
    grammar: etag-list
    multi: true
    components:
      value: {action: pseudonymise, category: entity-tag}
    source: {spec: RFC 9110, version: "2022-06", clause: "13.1.1"}
  - name: If-None-Match
    grammar: etag-list
    multi: true
    components:
      value: {action: pseudonymise, category: entity-tag}
    source: {spec: RFC 9110, version: "2022-06", clause: "13.1.2"}
  - name: Location
    grammar: http-uri
    components:
      uri: {action: uri}
    source: {spec: RFC 9110, version: "2022-06", clause: "10.2.2"}
  - name: Content-Location
    grammar: http-uri
    components:
      uri: {action: uri}
    source: {spec: RFC 9110, version: "2022-06", clause: "8.7"}
  - name: Allow
    grammar: token-list
    multi: true
    action: keep
    values: [GET, HEAD, POST, PUT, DELETE, CONNECT, OPTIONS, TRACE]
    source: {spec: RFC 9110, version: "2022-06", clause: "10.2.1"}
  - name: Vary
    grammar: token-list
    multi: true
    action: keep
    values: ["*", accept, accept-encoding, authorization, cookie]
    source: {spec: RFC 9110, version: "2022-06", clause: "12.5.5"}
  - name: Range
    grammar: range
    action: keep
    source: {spec: RFC 9110, version: "2022-06", clause: "14.2"}
  - name: Content-Range
    grammar: range
    action: keep
    source: {spec: RFC 9110, version: "2022-06", clause: "14.4"}
  - name: Accept-Ranges
    grammar: token-list
    multi: true
    action: keep
    values: [bytes, none]
    source: {spec: RFC 9110, version: "2022-06", clause: "14.3"}
  - name: Retry-After
    grammar: retry-after
    action: keep
    source: {spec: RFC 9110, version: "2022-06", clause: "10.2.3"}
  - name: Max-Forwards
    grammar: number
    action: keep
    source: {spec: RFC 9110, version: "2022-06", clause: "7.6.2"}
  - name: Expect
    grammar: token
    action: keep
    values: [100-continue]
    source: {spec: RFC 9110, version: "2022-06", clause: "10.1.1"}
  - name: TE
    grammar: token-list
    multi: true
    action: keep
    values: [trailers]
    source: {spec: RFC 9110, version: "2022-06", clause: "10.1.4"}
  - name: Authorization
    grammar: http-credentials
    components:
      scheme: {action: keep}
    params:
      - {name: username, action: pseudonymise, category: sip-user, value: any, source: {spec: RFC 7616, version: "2015-09", clause: "3.4"}}
      - {name: realm, action: pseudonymise, category: domain, value: any, source: {spec: RFC 7616, version: "2015-09", clause: "3.4"}}
      - {name: nonce, action: pseudonymise, category: digest, value: any, source: {spec: RFC 7616, version: "2015-09", clause: "3.4"}}
      - {name: response, action: pseudonymise, category: digest, value: any, source: {spec: RFC 7616, version: "2015-09", clause: "3.4"}}
      - {name: cnonce, action: pseudonymise, category: digest, value: any, source: {spec: RFC 7616, version: "2015-09", clause: "3.4"}}
      - {name: opaque, action: pseudonymise, category: digest, value: any, source: {spec: RFC 7616, version: "2015-09", clause: "3.4"}}
      - {name: algorithm, action: keep, value: token, source: {spec: RFC 7616, version: "2015-09", clause: "3.4"}}
      - {name: qop, action: keep, value: token, source: {spec: RFC 7616, version: "2015-09", clause: "3.4"}}
      - {name: nc, action: keep, value: token, source: {spec: RFC 7616, version: "2015-09", clause: "3.4"}}
      - {name: userhash, action: keep, value: token, source: {spec: RFC 7616, version: "2015-09", clause: "3.4"}}
    source: {spec: RFC 9110, version: "2022-06", clause: "11.6.2"}
    note: "Basic loses its token68 (RFC 7617 §2); Bearer tokens follow the token rules (RFC 6750 §2.1); Digest uses these parameters"
  - name: Proxy-Authorization
    grammar: http-credentials
    components:
      scheme: {action: keep}
    params:
      - {name: username, action: pseudonymise, category: sip-user, value: any, source: {spec: RFC 7616, version: "2015-09", clause: "3.4"}}
      - {name: realm, action: pseudonymise, category: domain, value: any, source: {spec: RFC 7616, version: "2015-09", clause: "3.4"}}
      - {name: nonce, action: pseudonymise, category: digest, value: any, source: {spec: RFC 7616, version: "2015-09", clause: "3.4"}}
      - {name: response, action: pseudonymise, category: digest, value: any, source: {spec: RFC 7616, version: "2015-09", clause: "3.4"}}
      - {name: cnonce, action: pseudonymise, category: digest, value: any, source: {spec: RFC 7616, version: "2015-09", clause: "3.4"}}
      - {name: opaque, action: pseudonymise, category: digest, value: any, source: {spec: RFC 7616, version: "2015-09", clause: "3.4"}}
      - {name: algorithm, action: keep, value: token, source: {spec: RFC 7616, version: "2015-09", clause: "3.4"}}
      - {name: qop, action: keep, value: token, source: {spec: RFC 7616, version: "2015-09", clause: "3.4"}}
      - {name: nc, action: keep, value: token, source: {spec: RFC 7616, version: "2015-09", clause: "3.4"}}
    source: {spec: RFC 9110, version: "2022-06", clause: "11.7.2"}
  - name: WWW-Authenticate
    grammar: challenge
    components:
      scheme: {action: keep}
    params:
      - {name: realm, action: pseudonymise, category: domain, value: any, source: {spec: RFC 7616, version: "2015-09", clause: "3.3"}}
      - {name: nonce, action: pseudonymise, category: digest, value: any, source: {spec: RFC 7616, version: "2015-09", clause: "3.3"}}
      - {name: opaque, action: pseudonymise, category: digest, value: any, source: {spec: RFC 7616, version: "2015-09", clause: "3.3"}}
      - {name: algorithm, action: keep, value: token, source: {spec: RFC 7616, version: "2015-09", clause: "3.3"}}
      - {name: qop, action: keep, value: any, source: {spec: RFC 7616, version: "2015-09", clause: "3.3"}}
      - {name: stale, action: keep, value: token, source: {spec: RFC 7616, version: "2015-09", clause: "3.3"}}
      - {name: charset, action: keep, value: token, source: {spec: RFC 7616, version: "2015-09", clause: "3.3"}}
      - {name: userhash, action: keep, value: token, source: {spec: RFC 7616, version: "2015-09", clause: "3.3"}}
      - {name: error, action: keep, value: token, source: {spec: RFC 6750, version: "2012-10", clause: "3.1"}}
    source: {spec: RFC 9110, version: "2022-06", clause: "11.6.1"}
    note: "Bearer challenges keep error; scope, error_description and error_uri are removed (RFC 6750 §3)"
  - name: Proxy-Authenticate
    grammar: challenge
    components:
      scheme: {action: keep}
    params:
      - {name: realm, action: pseudonymise, category: domain, value: any, source: {spec: RFC 7616, version: "2015-09", clause: "3.3"}}
      - {name: nonce, action: pseudonymise, category: digest, value: any, source: {spec: RFC 7616, version: "2015-09", clause: "3.3"}}
      - {name: opaque, action: pseudonymise, category: digest, value: any, source: {spec: RFC 7616, version: "2015-09", clause: "3.3"}}
      - {name: algorithm, action: keep, value: token, source: {spec: RFC 7616, version: "2015-09", clause: "3.3"}}
      - {name: qop, action: keep, value: any, source: {spec: RFC 7616, version: "2015-09", clause: "3.3"}}
      - {name: stale, action: keep, value: token, source: {spec: RFC 7616, version: "2015-09", clause: "3.3"}}
    source: {spec: RFC 9110, version: "2022-06", clause: "11.7.1"}
  - name: Authentication-Info
    grammar: auth-params
    params:
      - {name: nextnonce, action: pseudonymise, category: digest, value: any, source: {spec: RFC 7616, version: "2015-09", clause: "3.5"}}
      - {name: rspauth, action: pseudonymise, category: digest, value: any, source: {spec: RFC 7616, version: "2015-09", clause: "3.5"}}
      - {name: cnonce, action: pseudonymise, category: digest, value: any, source: {spec: RFC 7616, version: "2015-09", clause: "3.5"}}
      - {name: qop, action: keep, value: token, source: {spec: RFC 7616, version: "2015-09", clause: "3.5"}}
      - {name: nc, action: keep, value: token, source: {spec: RFC 7616, version: "2015-09", clause: "3.5"}}
    source: {spec: RFC 9110, version: "2022-06", clause: "11.6.3"}
  - name: Cookie
    grammar: cookie
    action: pseudonymise
    source: {spec: RFC 6265, version: "2011-04", clause: "4.2.1"}
    note: "cookie names opaque, values removed"
  - name: Set-Cookie
    grammar: set-cookie
    action: pseudonymise
    source: {spec: RFC 6265, version: "2011-04", clause: "4.1.1"}
  - name: X-3GPP-Asserted-Identity
    grammar: identity
    components:
      uri: {action: uri}
    source: {spec: TS 24.482, version: "19.0.0", clause: "A.2.1.3"}
  - name: Sec-WebSocket-Version
    grammar: number
    action: keep
    source: {spec: RFC 6455, version: "2011-12", clause: "11.3.5"}
  - name: User-Agent
    grammar: opaque
    action: remove
    source: {spec: RFC 9110, version: "2022-06", clause: "10.1.5"}
    note: "free text (FR-007)"
  - name: Server
    grammar: opaque
    action: remove
    source: {spec: RFC 9110, version: "2022-06", clause: "10.2.4"}
    note: "free text (FR-007)"
  - name: Via
    grammar: opaque
    action: remove
    source: {spec: RFC 9110, version: "2022-06", clause: "7.6.3"}
    note: "proxy host names and comments"
  - name: Referer
    grammar: opaque
    action: remove
    source: {spec: RFC 9110, version: "2022-06", clause: "10.1.3"}
  - name: From
    grammar: opaque
    action: remove
    source: {spec: RFC 9110, version: "2022-06", clause: "10.1.2"}
  - name: Trailer
    grammar: opaque
    action: remove
    source: {spec: RFC 9110, version: "2022-06", clause: "6.6.2"}
    note: "trailer sections are removed with dechunking"
bodies:
  - {content_type: application/x-www-form-urlencoded, handling: form, source: {spec: RFC 6749, version: "2012-10", clause: "4.1.3"}}
  - {content_type: application/json, handling: json, params: [charset], source: {spec: RFC 6749, version: "2012-10", clause: "5.1"}}
  - {content_type: application/jwt, handling: jwt, source: {spec: RFC 7519, version: "2015-05", clause: "10.3.1"}}
  - {content_type: multipart/mixed, handling: multipart, params: [boundary], source: {spec: RFC 2046, version: "1996-11", clause: "5.1.3"}}
  - {content_type: application/xml, handling: xml, params: [charset], source: {spec: TS 33.180, version: "20.0.0", clause: "D.2.2"}}
  - {content_type: text/xml, handling: xml, params: [charset], source: {spec: TS 33.180, version: "20.0.0", clause: "D.3.1"}}
  - {content_type: application/xcap-diff+xml, handling: xml, params: [charset], source: {spec: RFC 5874, version: "2010-05", clause: "8.1"}}
  - {content_type: application/resource-lists+xml, handling: xml, params: [charset], source: {spec: RFC 4826, version: "2007-05", clause: "3.4.2"}}
  - {content_type: application/vnd.oma.poc.groups+xml, handling: xml, params: [charset], source: {spec: TS 24.481, version: "19.2.0", clause: "7.2.6"}}
  - {content_type: application/vnd.3gpp.gmop+xml, handling: xml, params: [charset], source: {spec: TS 24.481, version: "19.2.0", clause: "7.3.2"}}
  - {content_type: application/vnd.3gpp.mcptt-ue-init-config+xml, handling: xml, params: [charset], source: {spec: TS 24.484, version: "19.5.0", clause: "B.1.1"}}
  - {content_type: application/vnd.3gpp.mcptt-ue-config+xml, handling: xml, params: [charset], source: {spec: TS 24.484, version: "19.5.0", clause: "B.1.2"}}
  - {content_type: application/vnd.3gpp.mcptt-user-profile+xml, handling: xml, params: [charset], source: {spec: TS 24.484, version: "19.5.0", clause: "B.1.3"}}
  - {content_type: application/vnd.3gpp.mcptt-service-config+xml, handling: xml, params: [charset], source: {spec: TS 24.484, version: "19.5.0", clause: "B.1.4"}}
  - {content_type: application/vnd.3gpp.mcdata-service-config+xml, handling: xml, params: [charset], source: {spec: TS 24.484, version: "19.5.0", clause: "B.1.5"}}
  - {content_type: application/vnd.3gpp.mcvideo-service-config+xml, handling: xml, params: [charset], source: {spec: TS 24.484, version: "19.5.0", clause: "B.1.6"}}
  - {content_type: application/vnd.3gpp.mcvideo-ue-config+xml, handling: xml, params: [charset], source: {spec: TS 24.484, version: "19.5.0", clause: "B.1.7"}}
  - {content_type: application/vnd.3gpp.mcvideo-user-profile+xml, handling: xml, params: [charset], source: {spec: TS 24.484, version: "19.5.0", clause: "B.1.8"}}
  - {content_type: application/vnd.3gpp.mcdata-ue-config+xml, handling: xml, params: [charset], source: {spec: TS 24.484, version: "19.5.0", clause: "B.1.9"}}
  - {content_type: application/vnd.3gpp.mcdata-user-profile+xml, handling: xml, params: [charset], source: {spec: TS 24.484, version: "19.5.0", clause: "B.1.10"}}
  - {content_type: application/vnd.3gpp.mcs-location-user-config+xml, handling: xml, params: [charset], source: {spec: TS 24.484, version: "19.5.0", clause: "B.1.12"}}
paths:
  - {segment: keymanagement, source: {spec: TS 33.180, version: "20.0.0", clause: "D.2.1"}}
  - {segment: identity, source: {spec: TS 33.180, version: "20.0.0", clause: "D.2.1"}}
  - {segment: v1, source: {spec: TS 33.180, version: "20.0.0", clause: "D.2.1"}}
  - {segment: init, source: {spec: TS 33.180, version: "20.0.0", clause: "D.2.3"}}
  - {segment: keyprov, source: {spec: TS 33.180, version: "20.0.0", clause: "D.2.4"}}
  - {segment: certcache, source: {spec: TS 33.180, version: "20.0.0", clause: "D.2.5"}}
  - {segment: cert, source: {spec: TS 33.180, version: "20.0.0", clause: "D.2.6"}}
  - {segment: lookup, source: {spec: TS 33.180, version: "20.0.0", clause: "D.2.7"}}
  - {segment: redirect, source: {spec: TS 33.180, version: "20.0.0", clause: "D.2.8"}}
cookies:
  attributes:
    - {name: Expires, action: date, source: {spec: RFC 6265, version: "2011-04", clause: "4.1.2.1"}}
    - {name: Max-Age, action: number, source: {spec: RFC 6265, version: "2011-04", clause: "4.1.2.2"}}
    - {name: Domain, action: domain, source: {spec: RFC 6265, version: "2011-04", clause: "4.1.2.3"}}
    - {name: Path, action: path, source: {spec: RFC 6265, version: "2011-04", clause: "4.1.2.4"}}
    - {name: Secure, action: keep, source: {spec: RFC 6265, version: "2011-04", clause: "4.1.2.5"}}
    - {name: HttpOnly, action: keep, source: {spec: RFC 6265, version: "2011-04", clause: "4.1.2.6"}}
