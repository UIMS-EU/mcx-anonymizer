# SPDX-License-Identifier: GPL-3.0-or-later
#
# TLS rule set (feature 007): record content types, handshake message types, hello extensions,
# the key exchange family of each cipher suite (from the suite definitions), and the X.509 name
# attributes, certificate extensions and public key algorithms. Everything
# without a rule is zeroed. Sources: rules/SOURCES.md § TLS rule set.
