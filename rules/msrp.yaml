#
# Media rule set (feature 004). Sources: rules/SOURCES.md § Media plane.
ruleset: mcxanon-media
version: 1.0.0

# MSRP for MCData (FR-026 to FR-029). A method without a rule zeroes the message; a header without a rule is
# removed and counted.
msrp:
  methods:
    - {name: SEND, action: keep, source: {spec: RFC 4975, version: "2007-09", clause: "7.1"}}
    - {name: REPORT, action: keep, source: {spec: RFC 4975, version: "2007-09", clause: "7.1.2"}}
  headers:
    # The a=path mapping of feature 002 (FR-027).
    - {name: To-Path, action: pseudonymise, source: {spec: RFC 4975, version: "2007-09", clause: "9"}}
    - {name: From-Path, action: pseudonymise, source: {spec: RFC 4975, version: "2007-09", clause: "9"}}
    # Consistent across chunks and REPORTs (msrp-msgid mapping).
    - {name: Message-ID, action: pseudonymise, source: {spec: RFC 4975, version: "2007-09", clause: "7.1.1"}}
    - {name: Byte-Range, action: keep, source: {spec: RFC 4975, version: "2007-09", clause: "7.1.1"}}
    - {name: Success-Report, action: keep, source: {spec: RFC 4975, version: "2007-09", clause: "9"}}
    - {name: Failure-Report, action: keep, source: {spec: RFC 4975, version: "2007-09", clause: "9"}}
    # Namespace and status code kept; the comment is removed (B14).
    - {name: Status, action: keep, source: {spec: RFC 4975, version: "2007-09", clause: "7.1.3"}}
    # The media type kept; boundary pseudonymised, charset kept, other parameters removed.
    - {name: Content-Type, action: keep, source: {spec: RFC 4975, version: "2007-09", clause: "9"}}
    # The disposition type kept, its parameters removed (B15).
    - {name: Content-Disposition, action: keep, source: {spec: RFC 4975, version: "2007-09", clause: "9"}}
    - {name: Content-ID, action: remove, source: {spec: RFC 4975, version: "2007-09", clause: "9"}}
    - {name: Content-Description, action: remove, source: {spec: RFC 4975, version: "2007-09", clause: "9"}}
  elements:
    - {name: tid, action: pseudonymise, source: {spec: RFC 4975, version: "2007-09", clause: "7.1"}}
    # FR-028: zeros of the same length, which can never form the end-line.
    - {name: content, action: zero, source: {spec: RFC 4975, version: "2007-09", clause: "7.1"}}
    - {name: comment, action: remove, source: {spec: RFC 4975, version: "2007-09", clause: "9"}}
