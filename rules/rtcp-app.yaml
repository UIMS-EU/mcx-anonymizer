      - {id: 9, name: Queued User ID, encoding: uri, action: pseudonymise, source: {spec: TS 24.581, version: "V19.1.0", clause: "9.2.3.14"}}
      - {id: 10, name: Source, encoding: u16, action: keep, source: {spec: TS 24.581, version: "V19.1.0", clause: "9.2.3.12"}}
      - {id: 11, name: Track Info, encoding: track-info, action: pseudonymise, source: {spec: TS 24.581, version: "V19.1.0", clause: "9.2.3.13"}}
      - {id: 12, name: Message Type, encoding: u8+spare, action: keep, source: {spec: TS 24.581, version: "V19.1.0", clause: "9.2.3.10"}}
      - {id: 13, name: Transmission Indicator, encoding: u16, action: keep, source: {spec: TS 24.581, version: "V19.1.0", clause: "9.2.3.11"}}
