      - {id: 1, name: Duration, encoding: u16, action: keep, source: {spec: TS 24.581, version: "V19.1.0", clause: "9.2.3.3"}}
      - {id: 2, name: Reject Cause, encoding: reject-cause, action: keep, source: {spec: TS 24.581, version: "V19.1.0", clause: "9.2.3.4"}}
      - {id: 3, name: Queue Info, encoding: u16, action: keep, source: {spec: TS 24.581, version: "V19.1.0", clause: "9.2.3.5"}}
      - {id: 4, name: User Id of the Transmitting User, encoding: uri, action: pseudonymise, source: {spec: TS 24.581, version: "V19.1.0", clause: "9.2.3.6"}}
      - {id: 5, name: Permission to Request the Transmission, encoding: u16, action: keep, source: {spec: TS 24.581, version: "V19.1.0", clause: "9.2.3.7"}}
