      - {name: Remote Transmission request, subtype: 7, ack_variant: true, source: {spec: TS 24.581, version: "V19.1.0", clause: "9.2.22"}}
      - {name: Remote Transmission cancel request, subtype: 8, ack_variant: true, source: {spec: TS 24.581, version: "V19.1.0", clause: "9.2.24"}}
    fields:
