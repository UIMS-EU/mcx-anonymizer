      - {id: 16, name: Message Name, encoding: message-name, action: keep, source: {spec: TS 24.581, version: "V19.1.0", clause: "9.2.3.18"}}
      - {id: 17, name: Overriding ID, encoding: uri, action: pseudonymise, source: {spec: TS 24.581, version: "V19.1.0", clause: "9.2.3.8"}}
      - {id: 18, name: Overridden ID, encoding: uri, action: pseudonymise, source: {spec: TS 24.581, version: "V19.1.0", clause: "9.2.3.8"}}
      - {id: 19, name: Reception Priority, encoding: u8+spare, action: keep, source: {spec: TS 24.581, version: "V19.1.0", clause: "9.2.3.19"}}
