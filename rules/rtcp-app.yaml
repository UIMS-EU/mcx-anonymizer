      - {id: 6, name: User ID, encoding: uri, action: pseudonymise, source: {spec: TS 24.581, version: "V19.1.0", clause: "9.2.3.8"}}
      - {id: 7, name: Queue Size, encoding: u16, action: keep, source: {spec: TS 24.581, version: "V19.1.0", clause: "9.2.3.15"}}
