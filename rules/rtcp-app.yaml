  # --- MCVideo transmission control, server to participant (TS 24.581 §9.2, Table 9.2.2.1-2) ---
  - family: mcv1
    names: [MCV1]
    source: {spec: TS 24.581, version: "V19.1.0", clause: "9.1.2"}
