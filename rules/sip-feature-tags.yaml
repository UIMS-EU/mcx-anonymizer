#
# Media feature tags (Contact, Accept-Contact, Reject-Contact; RFC 3840, RFC 3841),
# feature-capability indicators (Feature-Caps, RFC 6809) and ICSI values (TS 24.229 §7.2A.8;
# FR-008). Sources: rules/SOURCES.md. A tag, indicator or ICSI/IARI value without a rule is
# removed and counted. Base tags (RFC 3840 §9) appear without "+" and without "sip.".
# Not on the list because no indexed document defines them: g.3gpp.mcdata (used but not
# defined in TS 24.282), g.3gpp.mcvideomedia, g.3gpp.ics, g.3gpp.atcf, g.3gpp.datachannel,
# g.3gpp.dc-mux, the mmtel ICSI family and every IARI value.
ruleset: mcxanon-sip
version: 1.2.0
