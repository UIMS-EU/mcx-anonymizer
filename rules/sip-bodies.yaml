#
# Message and part bodies by Content-Type (RFC 3261 §20.15, RFC 2046; FR-022, FR-023).
# Sources: rules/SOURCES.md. A body type without a rule is emptied too, but counted as unknown;
# an emptied part keeps its part headers (FR-023). Feature 003 switches the MCX XML bodies to
# handling xml one document family at a time (rules/xml-*.yaml); MIKEY follows in feature 005.
ruleset: mcxanon-sip
version: 1.2.0
bodies:
  - {content_type: application/sdp, handling: sdp, params: [], source: {spec: RFC 8866, version: "2021-01", clause: "8"}}
  - {content_type: multipart/mixed, handling: multipart, params: [boundary], source: {spec: RFC 2046, version: "1996-11", clause: "5.1.3"}}
  - {content_type: multipart/alternative, handling: multipart, params: [boundary], source: {spec: RFC 2046, version: "1996-11", clause: "5.1.4"}}
  - {content_type: application/vnd.3gpp.mcptt-info+xml, handling: xml, source: {spec: TS 24.379, version: "19.6.0", clause: "F.1.4"}}
  - {content_type: application/vnd.3gpp.mcptt-mbms-usage-info+xml, handling: xml, source: {spec: TS 24.379, version: "19.6.0", clause: "F.2.4"}}
  - {content_type: application/vnd.3gpp.mcptt-location-info+xml, handling: xml, source: {spec: TS 24.379, version: "19.6.0", clause: "F.3.4"}}
  - {content_type: application/vnd.3gpp.mcptt-affiliation-command+xml, handling: xml, source: {spec: TS 24.379, version: "19.6.0", clause: "F.4.4"}}
  - {content_type: application/vnd.3gpp.mcdata-info+xml, handling: xml, source: {spec: TS 24.282, version: "19.6.0", clause: "D.1.4"}}
  - {content_type: application/vnd.3gpp.mcdata-signalling, handling: empty, source: {spec: TS 24.282, version: "19.6.0", clause: "6.4"}}
  - {content_type: application/vnd.3gpp.mcdata-payload, handling: empty, source: {spec: TS 24.282, version: "19.6.0", clause: "6.4"}}
  - {content_type: application/vnd.3gpp.mcvideo-info+xml, handling: xml, source: {spec: TS 24.281, version: "19.5.0", clause: "F.1.4"}}
  - {content_type: application/vnd.3gpp.location-info+xml, handling: xml, source: {spec: TS 24.281, version: "19.5.0", clause: "6.2.9.1"}}
  - {content_type: application/pidf+xml, handling: xml, source: {spec: TS 24.379, version: "19.6.0", clause: "9.3.1"}}
  - {content_type: application/resource-lists+xml, handling: xml, source: {spec: TS 24.379, version: "19.6.0", clause: "4.8"}}
  - {content_type: application/poc-settings+xml, handling: xml, source: {spec: TS 24.379, version: "19.6.0", clause: "7.4.1.2.2"}}
  - {content_type: application/xcap-diff+xml, handling: xml, source: {spec: RFC 5875, version: "2010-05", clause: "4.6"}}
  - {content_type: application/vnd.3gpp.mcptt-floor-request+xml, handling: xml, source: {spec: TS 24.379, version: "19.6.0", clause: "F.5.4"}}
  - {content_type: application/vnd.3gpp.mcptt-signed+xml, handling: xml, source: {spec: TS 24.379, version: "19.6.0", clause: "F.6.4"}}
  - {content_type: application/vnd.3gpp.mcptt-regroup+xml, handling: xml, source: {spec: TS 24.379, version: "19.6.0", clause: "F.7.4"}}
  - {content_type: application/vnd.3gpp.mcptt-mbs-usage-info+xml, handling: xml, source: {spec: TS 24.379, version: "19.6.0", clause: "F.2A.4"}}
  - {content_type: application/vnd.3gpp.mcdata-affiliation-command+xml, handling: xml, source: {spec: TS 24.282, version: "19.6.0", clause: "D.3.4"}}
  - {content_type: application/vnd.3gpp.mcdata-location-info+xml, handling: xml, source: {spec: TS 24.282, version: "19.6.0", clause: "D.4.4"}}
  - {content_type: application/vnd.3gpp.mcdata-mbms-usage-info+xml, handling: xml, source: {spec: TS 24.282, version: "19.6.0", clause: "D.5.4"}}
  - {content_type: application/vnd.3gpp.mcdata-regroup+xml, handling: xml, source: {spec: TS 24.282, version: "19.6.0", clause: "D.6.4"}}
  - {content_type: application/vnd.3gpp.mcdata-msgstore-ctrl-request+xml, handling: xml, source: {spec: TS 24.282, version: "19.6.0", clause: "D.7.4"}}
  - {content_type: application/vnd.3gpp.mvdata-mbs-usage-info+xml, handling: xml, source: {spec: TS 24.282, version: "19.6.0", clause: "D.8.4"}}
  - {content_type: application/vnd.3gpp.mcdata-mbs-usage-info+xml, handling: xml, source: {spec: TS 24.282, version: "19.6.0", clause: "6.5.3.1"}}
  - {content_type: application/vnd.3gpp.mcvideo-mbms-usage-info+xml, handling: xml, source: {spec: TS 24.281, version: "19.5.0", clause: "F.2.4"}}
  - {content_type: application/vnd.3gpp.mcvideo-mbs-usage-info+xml, handling: xml, source: {spec: TS 24.281, version: "19.5.0", clause: "F.2A.4"}}
  - {content_type: application/vnd.3gpp.mcvideo-location-info+xml, handling: xml, source: {spec: TS 24.281, version: "19.5.0", clause: "F.3.4"}}
  - {content_type: application/vnd.3gpp.mcvideo-affiliation-command+xml, handling: xml, source: {spec: TS 24.281, version: "19.5.0", clause: "F.4.4"}}
  - {content_type: application/vnd.3gpp.mcvideo-transmission-request+xml, handling: xml, source: {spec: TS 24.281, version: "19.5.0", clause: "F.5.4"}}
  - {content_type: application/vnd.3gpp.mcvideo-regroup+xml, handling: xml, source: {spec: TS 24.281, version: "19.5.0", clause: "F.6.4"}}
  - {content_type: application/reginfo+xml, handling: xml, source: {spec: TS 24.229, version: "24229-j70", clause: "5.4.2.1.2"}}
  - {content_type: application/conference-info+xml, handling: xml, source: {spec: TS 24.379, version: "19.6.0", clause: "10.1.3.2"}}
  # Feature 005: the MIKEY-SAKKE I_MESSAGE is rewritten (rules/mikey.yaml); a version other than 1
  # falls back to the emptied body. Carried in REGISTER, PUBLISH, MESSAGE and SUBSCRIBE (TS 24.379
  # §7.2.1, §7.2.2, §7.3.7; TS 24.481 §6.3.13.2.1).
  - {content_type: application/mikey, handling: mikey, params: [version], source: {spec: RFC 3830, version: "2004-08", clause: "10.1"}}
  - {content_type: text/plain, handling: empty, source: {spec: RFC 2046, version: "1996-11", clause: "4.1.3"}}
