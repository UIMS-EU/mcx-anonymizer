#
# Media rule set (feature 004). Sources: rules/SOURCES.md § Media plane.
ruleset: mcxanon-media
version: 1.0.0

# RTCP (FR-009 to FR-013). Packet types,
# feedback formats and XR blocks without a rule keep their 4-octet header and have their body
# zeroed; SDES items without a rule are removed.
rtcp:
  packet_types:
    - {pt: 200, name: SR, action: keep, source: {spec: RFC 3550, version: "2003-07", clause: "6.4.1"}}
    - {pt: 201, name: RR, action: keep, source: {spec: RFC 3550, version: "2003-07", clause: "6.4.2"}}
    - {pt: 202, name: SDES, action: keep, source: {spec: RFC 3550, version: "2003-07", clause: "6.5"}}
    - {pt: 203, name: BYE, action: keep, source: {spec: RFC 3550, version: "2003-07", clause: "6.6"}}
    - {pt: 204, name: APP, action: keep, source: {spec: RFC 3550, version: "2003-07", clause: "6.7"}}
    - {pt: 205, name: RTPFB, action: keep, source: {spec: RFC 4585, version: "2006-07", clause: "6.1"}}
    - {pt: 206, name: PSFB, action: keep, source: {spec: RFC 4585, version: "2006-07", clause: "6.1"}}
    - {pt: 207, name: XR, action: keep, source: {spec: RFC 3611, version: "2003-11", clause: "2"}}
  # FR-010: CNAME uses the CNAME mapping of 002 (a=ssrc cname); every other item is removed.
  sdes_items:
    - {type: 1, name: CNAME, action: pseudonymise, source: {spec: RFC 3550, version: "2003-07", clause: "6.5.1"}}
    - {type: 2, name: NAME, action: remove, source: {spec: RFC 3550, version: "2003-07", clause: "6.5.2"}}
    - {type: 3, name: EMAIL, action: remove, source: {spec: RFC 3550, version: "2003-07", clause: "6.5.3"}}
    - {type: 4, name: PHONE, action: remove, source: {spec: RFC 3550, version: "2003-07", clause: "6.5.4"}}
    - {type: 5, name: LOC, action: remove, source: {spec: RFC 3550, version: "2003-07", clause: "6.5.5"}}
    - {type: 6, name: TOOL, action: remove, source: {spec: RFC 3550, version: "2003-07", clause: "6.5.6"}}
    - {type: 7, name: NOTE, action: remove, source: {spec: RFC 3550, version: "2003-07", clause: "6.5.7"}}
    - {type: 8, name: PRIV, action: remove, source: {spec: RFC 3550, version: "2003-07", clause: "6.5.8"}}
  # FR-011: the reason text is removed.
  bye_reason: {action: remove, source: {spec: RFC 3550, version: "2003-07", clause: "6.6"}}
  # FR-012: NACK, PLI, SLI kept; RPSI kept with its bit string zeroed;
  # application layer feedback zeroed.
  feedback:
    - {pt: 205, fmt: 1, name: Generic NACK, action: keep, source: {spec: RFC 4585, version: "2006-07", clause: "6.2.1"}}
    - {pt: 206, fmt: 1, name: PLI, action: keep, source: {spec: RFC 4585, version: "2006-07", clause: "6.3.1"}}
    - {pt: 206, fmt: 2, name: SLI, action: keep, source: {spec: RFC 4585, version: "2006-07", clause: "6.3.2"}}
    - {pt: 206, fmt: 3, name: RPSI, action: keep, source: {spec: RFC 4585, version: "2006-07", clause: "6.3.3"}}
    - {pt: 206, fmt: 15, name: Application layer FB, action: zero, source: {spec: RFC 4585, version: "2006-07", clause: "6.4"}}
  xr_blocks:
    - {bt: 1, name: Loss RLE, action: keep, source: {spec: RFC 3611, version: "2003-11", clause: "4.1"}}
    - {bt: 2, name: Duplicate RLE, action: keep, source: {spec: RFC 3611, version: "2003-11", clause: "4.2"}}
    - {bt: 3, name: Packet Receipt Times, action: keep, source: {spec: RFC 3611, version: "2003-11", clause: "4.3"}}
    - {bt: 4, name: Receiver Reference Time, action: keep, source: {spec: RFC 3611, version: "2003-11", clause: "4.4"}}
    - {bt: 5, name: DLRR, action: keep, source: {spec: RFC 3611, version: "2003-11", clause: "4.5"}}
    - {bt: 6, name: Statistics Summary, action: keep, source: {spec: RFC 3611, version: "2003-11", clause: "4.6"}}
    - {bt: 7, name: VoIP Metrics, action: keep, source: {spec: RFC 3611, version: "2003-11", clause: "4.7"}}
