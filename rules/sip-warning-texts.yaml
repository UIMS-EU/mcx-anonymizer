# Warning texts of the MCX standards (feature 008, FR-006). An MCX server includes the Warning
# code 399 with a text "<3-digit code> <explanatory text>" from a table of its standard
# (TS 24.379 §4.4.1/§4.4.2, TS 24.281 §4.4.1/§4.4.2, TS 24.282 §4.9.1/§4.9.2). A warn-text that
# is exactly one of these entries after warn-code 399 is standard vocabulary and is kept; any other
# text is blanked (rules/sip-headers.yaml, Warning). The texts are quoted verbatim from the tables;
# "<detailed reason>" of code 100 is expanded with the reasons its Description lists (its
# free-text variant is not an entry). Sources: rules/SOURCES.md.
