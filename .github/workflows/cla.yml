# SPDX-License-Identifier: GPL-3.0-or-later
# Every external contributor signs the Contributor Licence Agreement (CLA.md)
# once, by posting the sign-off comment on a pull request. Signatures are stored
# in the branch `cla-signatures` of this repository.
#
# Action: CLA Assistant Lite (Apache-2.0), pinned to the commit of release v2.6.1.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Contributor Licence Agreement
        if: >
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08  # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: ${{ github.server_url }}/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          allowlist: ${{ github.repository_owner }},dependabot[bot]
